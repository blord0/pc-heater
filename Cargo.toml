[package]
name = "pc-heater"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
nvml-wrapper = "0.13.0"
pollster = "1.0.1"
sysinfo = { version = "0.40.3", default-features = false, features = ["component", "system"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
